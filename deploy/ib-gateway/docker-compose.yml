services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    container_name: lifehub-ib-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TWS_USERID: ${TWS_USERID}
      TWS_PASSWORD: ${TWS_PASSWORD}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      TWS_ACCEPT_INCOMING: "accept"
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-restart}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      TIME_ZONE: ${TIME_ZONE:-Asia/Shanghai}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-05:30 AM}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      # 仅绑定本机回环地址，防止公网直接访问 IB Gateway API 与 VNC
      - "127.0.0.1:4001:4003"
      - "127.0.0.1:4002:4004"
      - "127.0.0.1:5900:5900"
    volumes:
      - ./ibgateway_settings:/home/ibgateway/Jts
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
